<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ARI-Cs and rental affordability</title>
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@4.5.0/dist/pmtiles.js"></script>
  <style> body { margin: 0; } #map { position: absolute; inset: 0; } </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol('pmtiles', protocol.tile);
  </script>
  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: 'ARI-C_map_maybe_this_time.json',        // the file you downloaded from Maputnik
      center: [-124.8, 54.8],    // longitude, latitude
      zoom: 4.25
    });
    map.addControl(new maplibregl.NavigationControl());
    function onARICase(e) {
      const ARIC = e.features[0].properties;
      const unitsImpacted = e.features[0].properties['Increase unit #'];
      const requested = e.features[0].properties['Requested amt'];
      const granted = e.features[0].properties['Granted amt'];
      const corporateApplicant = e.features[0].properties['Corporate applicant'];
      const decision = e.features[0].properties['Decision'];
      const fileLink = e.features[0].properties['File Link'];
      const popup = new maplibregl.Popup();
      popup.setLngLat(e.lngLat);
      popup.setHTML('<p>Units Impacted: ${unitsImpacted}</p>
                    <p>Units Impacted: ${unitsImpacted}</p>
                    <p>Amount Requested: ${requested}</p>
                    <p>Amount Granted: ${granted}</p>
                    <p>Corporate Applicant: ${corporateApplicant}</p>
                    <p>Case Decision: ${decision}</p>
                    <p>File Link (if applicable: ${fileLink}</p>');
      popup.addTo(map)
      map.on('click', 'ARI-C_cases', onARICase)
  </script>
</body>
</html>
